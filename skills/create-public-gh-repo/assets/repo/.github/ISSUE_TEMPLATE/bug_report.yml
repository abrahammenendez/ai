name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected to see instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, device or runtime, and their versions.
